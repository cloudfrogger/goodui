kind: pipeline
type: kubernetes
name: homepage

trigger:
  event:
    - push
    - custom
  branch:
    - master

steps:
  - name: build-and-publish
    image: plugins/kaniko:1.13.13@sha256:f497739d4d9c56783dc031beb8a114c25b360e6cbdfec3fc350b97d2455d2b8a
    settings:
      dockerfile: deploy/Dockerfile
      context: .
      registry:
        from_secret: registry_host
      repo:
        from_secret: registry_image
      username:
        from_secret: registry_username
      password:
        from_secret: registry_password
      tags:
        - ${DRONE_COMMIT_SHA}
        - latest

  - name: deploy-kubernetes
    image: node:22-bookworm-slim@sha256:de170b39439eb0e5a3444ad7d60b015614a381e10fecae2e30ec9e735122f38d
    user: 10001
    environment:
      K8S_API_SERVER:
        from_secret: k8s_api_server
      K8S_CA_PEM_B64:
        from_secret: k8s_ca_pem_b64
      K8S_TOKEN:
        from_secret: k8s_token
      K8S_NAMESPACE:
        from_secret: k8s_namespace
      K8S_DEPLOYMENT:
        from_secret: k8s_deployment
      REGISTRY_IMAGE:
        from_secret: registry_image
    commands:
      - node --test scripts/deploy-kubernetes.test.mjs
      - node scripts/deploy-kubernetes.mjs
    when:
      event:
        - push
      branch:
        - master
