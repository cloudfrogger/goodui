worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    autoindex off;
    sendfile on;
    keepalive_timeout 30s;
    client_max_body_size 1m;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    log_format goodui '$remote_addr cf_connecting_ip=$http_cf_connecting_ip cf_ray=$http_cf_ray '
                      '"$request" $status $body_bytes_sent "$http_user_agent"';
    access_log /dev/stdout goodui;

    server {
        listen 8080;
        listen [::]:8080;
        root /usr/share/nginx/html;
        index index.html;

        include /etc/nginx/security-headers.conf;

        location = /healthz {
            access_log off;
            include /etc/nginx/security-headers.conf;
            default_type text/plain;
            return 200 'ok';
        }

        location = /index.html {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            try_files $uri =404;
        }

        location ~* "-[a-z0-9]{8,}\.(?:js|css)$" {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        location ~* \.(?:js|css|woff2?|png|jpe?g|gif|svg|webp|ico)$ {
            try_files $uri =404;
        }

        location ~ /\. {
            return 404;
        }

        location ~* \.map$ {
            return 404;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
