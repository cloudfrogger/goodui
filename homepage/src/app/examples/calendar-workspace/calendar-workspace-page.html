<good-main-view layout="fill">
  <good-calendar label="Example schedule" [fillHeight]="true" [events]="visibleEvents()" [(date)]="date"
    [showDayStrip]="true" [view]="view()" (viewChange)="setView($event)"
    [sidebarEnabled]="true" [sidebarOpen]="sidebarOpen()" (sidebarOpenChange)="setSidebarOpen($event)"
    (eventSelected)="selectEvent($event)" (eventMoved)="moveEvent($event)" (eventResized)="resizeEvent($event)">
    <div goodCalendarSidebar>
      <good-month-calendar [month]="monthKey()" [selected]="selectedDay()" (selectionChange)="pickDay($event)" />
      <good-listbox label="My calendars" [showLabel]="true" [items]="calendars"
        selectionMode="multiple" appearance="checkbox" [(selectedIds)]="visibleCalendars" />
    </div>
    <good-action-group goodCalendarActions orientation="responsive">
      <good-button size="small" (click)="createEvent()">New event</good-button>
      <good-button size="small" variant="outline" (click)="sourceOpen.set(true)">View source</good-button>
    </good-action-group>
  </good-calendar>
</good-main-view>
<span class="good-sr-only" role="status">{{ feedback() }}</span>
<good-modal [(open)]="sourceOpen" size="large" [scrollBody]="true">
  <good-modal-header title="Calendar workspace source" />
  <good-code-block [code]="htmlSource" language="html" title="calendar-workspace-page.html" />
  <good-code-block [code]="typescriptSource" language="typescript" title="calendar-workspace-page.ts" />
</good-modal>
