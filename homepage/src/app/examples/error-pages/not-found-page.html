<good-main-view>

    description="The address may have changed, or this page may no longer be here. Let's get you back to something useful.">
    <good-button [icon]="homeIcon" (click)="goTo('/dashboard')">Back to dashboard</good-button>
    <good-button variant="outline" [icon]="exploreIcon" (click)="goTo('/components/buttons')">Explore components</good-button>
  </good-error-page>
</good-main-view>
