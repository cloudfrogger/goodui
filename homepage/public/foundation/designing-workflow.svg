<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" role="img" aria-labelledby="title description">
  <title id="title">Prompt a Penpot design, then build it in Angular</title>
  <desc id="description">First, a prompt and the linked GoodUI Penpot library produce the user's own Penpot screen. Second, that screen and another prompt guide an Angular implementation using the GoodUI Angular library, skill, and component catalog.</desc>
  <rect width="760" height="480" rx="24" fill="#f8faff"/>

  <rect x="20" y="18" width="720" height="194" rx="20" fill="#ffffff" stroke="#d9e2f2" stroke-width="2"/>
  <circle cx="54" cy="52" r="18" fill="#e5efff"/>
  <text x="54" y="59" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#1459de">1</text>
  <text x="84" y="59" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#111827">Design your screen in Penpot</text>
  <rect x="40" y="78" width="300" height="82" rx="14" fill="#f1f6ff" stroke="#a9c9f8"/>
  <text x="58" y="110" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#173968">Prompt 1</text>
  <text x="58" y="136" font-family="Arial,sans-serif" font-size="15" fill="#526177">Describe the screen you want</text>
  <path d="M350 119h59m-11-9 11 9-11 9" fill="none" stroke="#2173ed" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="420" y="78" width="300" height="82" rx="14" fill="#e9f1ff" stroke="#8ab5f8"/>
  <text x="438" y="110" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#102847">Your Penpot design</text>
  <text x="438" y="136" font-family="Arial,sans-serif" font-size="15" fill="#526177">Linked GoodUI components</text>
  <text x="40" y="190" font-family="Arial,sans-serif" font-size="15" fill="#42556f">GoodUI Penpot library supplies the components, variants, and tokens.</text>

  <path d="M380 219v36m-9-11 9 11 9-11" fill="none" stroke="#2173ed" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="401" y="243" font-family="Arial,sans-serif" font-size="14" fill="#42556f">Use this design as the source</text>

  <rect x="20" y="266" width="720" height="194" rx="20" fill="#ffffff" stroke="#d9e2f2" stroke-width="2"/>
  <circle cx="54" cy="300" r="18" fill="#e5efff"/>
  <text x="54" y="307" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#1459de">2</text>
  <text x="84" y="307" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#111827">Implement it in Angular</text>
  <rect x="40" y="326" width="300" height="82" rx="14" fill="#f1f6ff" stroke="#a9c9f8"/>
  <text x="58" y="358" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#173968">Prompt 2 + Penpot design</text>
  <text x="58" y="384" font-family="Arial,sans-serif" font-size="15" fill="#526177">Build this exact screen</text>
  <path d="M350 367h59m-11-9 11 9-11 9" fill="none" stroke="#2173ed" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="420" y="326" width="300" height="82" rx="14" fill="#e9f1ff" stroke="#8ab5f8"/>
  <text x="438" y="358" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#102847">Your Angular page</text>
  <text x="438" y="384" font-family="Arial,sans-serif" font-size="15" fill="#526177">Built with GoodUI Angular</text>
  <text x="40" y="438" font-family="Arial,sans-serif" font-size="15" fill="#42556f">GoodUI Angular library + skill/catalog supply real components and APIs.</text>
</svg>
