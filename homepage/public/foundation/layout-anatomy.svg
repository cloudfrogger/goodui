<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 780" role="img" aria-labelledby="title description">
  <title id="title">Anatomy of the GoodUI application layout</title>
  <desc id="description">Desktop has a fixed sidebar, topbar, and routed page. At 900 pixels and below, the sidebar becomes a drawer beneath a compact topbar. The page remains in MainView.</desc>
  <defs>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      .title { fill: #111827; font-size: 27px; font-weight: 700; }
      .subtitle { fill: #475569; font-size: 15px; }
      .label { fill: #1e293b; font-size: 15px; font-weight: 700; }
      .detail { fill: #475569; font-size: 13px; }
      .small { fill: #475569; font-size: 12px; }
      .blue { fill: #155dfb; }
      .white { fill: #ffffff; }
      .line { stroke: #d9e1ed; stroke-width: 1.5; }
    </style>
    <filter id="shadow" x="-5%" y="-8%" width="110%" height="125%">
      <feDropShadow dx="0" dy="7" stdDeviation="12" flood-color="#20365d" flood-opacity="0.09" />
    </filter>
    <clipPath id="desktop-clip"><rect x="35" y="120" width="830" height="330" rx="14" /></clipPath>
    <clipPath id="mobile-left-clip"><rect x="35" y="535" width="238" height="196" rx="13" /></clipPath>
    <clipPath id="mobile-right-clip"><rect x="331" y="535" width="238" height="196" rx="13" /></clipPath>
  </defs>

  <rect width="900" height="780" rx="20" fill="#f5f8fd" />
  <text x="35" y="50" class="title">One shell, two screen sizes</text>
  <text x="35" y="78" class="subtitle">The application owns the navigation data and page; GoodUI arranges the frame.</text>

  <text x="35" y="108" class="label">Desktop</text>
  <text x="772" y="108" class="detail">&gt; 900 px</text>
  <rect x="35" y="120" width="830" height="330" rx="14" fill="#ffffff" filter="url(#shadow)" />
  <g clip-path="url(#desktop-clip)">
    <rect x="35" y="120" width="204" height="330" fill="#eff5ff" />
    <path d="M239 120v330" class="line" />
    <circle cx="67" cy="153" r="12" fill="#155dfb" />
    <path d="M61 153l4 4 8-9" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="89" y="159" class="label">Your brand</text>
    <text x="57" y="204" class="small">PRIMARY NAVIGATION</text>
    <rect x="53" y="218" width="169" height="32" rx="7" fill="#d9e8ff" />
    <circle cx="70" cy="234" r="5" fill="#155dfb" />
    <text x="84" y="239" class="blue" font-size="13" font-weight="700">Overview</text>
    <circle cx="70" cy="274" r="5" fill="#8fa2bc" />
    <text x="84" y="279" class="detail">Projects</text>
    <circle cx="70" cy="311" r="5" fill="#8fa2bc" />
    <text x="84" y="316" class="detail">Settings</text>

    <rect x="239" y="120" width="626" height="56" fill="#ffffff" />
    <path d="M239 176h626" class="line" />
    <text x="264" y="155" class="detail">Home</text>
    <text x="324" y="155" class="detail">Projects</text>
    <text x="399" y="155" class="detail">Help</text>
    <circle cx="801" cy="148" r="13" fill="#e7edf6" />
    <text x="795" y="153" class="small">AM</text>
    <rect x="239" y="176" width="626" height="274" fill="#ffffff" />
    <text x="268" y="219" class="blue" font-size="12" font-weight="700">WORKSPACE</text>
    <text x="268" y="251" fill="#111827" font-size="24" font-weight="700">Overview</text>
    <text x="268" y="276" class="detail">Your page content starts here.</text>
    <rect x="268" y="304" width="567" height="110" rx="10" fill="#f8fafc" stroke="#d9e1ed" />
    <rect x="288" y="326" width="155" height="14" rx="4" fill="#dbe7f6" />
    <rect x="288" y="353" width="351" height="9" rx="4" fill="#e6edf6" />
    <rect x="288" y="373" width="263" height="9" rx="4" fill="#e6edf6" />
  </g>
  <rect x="49" y="393" width="175" height="42" rx="8" fill="#ffffff" stroke="#c8d8ee" />
  <text x="60" y="410" class="blue" font-size="12" font-weight="700">01  SidebarContainer</text>
  <text x="60" y="425" class="small">fixed · 280 px at full scale</text>
  <rect x="625" y="127" width="225" height="42" rx="8" fill="#ffffff" stroke="#c8d8ee" />
  <text x="637" y="145" class="blue" font-size="12" font-weight="700">02  Topbar</text>
  <text x="637" y="160" class="small">navigation + actions · 70 px</text>
  <rect x="635" y="391" width="212" height="43" rx="8" fill="#ffffff" stroke="#c8d8ee" />
  <text x="647" y="408" class="blue" font-size="12" font-weight="700">03  MainView</text>
  <text x="647" y="424" class="small">routed heading + content</text>

  <path d="M35 482h830" class="line" />
  <text x="35" y="515" class="label">Mobile</text>
  <text x="487" y="515" class="detail">≤ 900 px</text>

  <rect x="35" y="535" width="238" height="196" rx="13" fill="#ffffff" filter="url(#shadow)" />
  <g clip-path="url(#mobile-left-clip)">
    <rect x="35" y="535" width="238" height="43" fill="#ffffff" />
    <path d="M35 578h238" class="line" />
    <path d="M52 549h16m-16 6h16m-16 6h16" stroke="#155dfb" stroke-width="2" stroke-linecap="round" />
    <circle cx="91" cy="556" r="10" fill="#155dfb" />
    <text x="110" y="561" class="label">Your app</text>
    <text x="51" y="610" class="blue" font-size="11" font-weight="700">WORKSPACE</text>
    <text x="51" y="639" fill="#111827" font-size="20" font-weight="700">Overview</text>
    <rect x="51" y="657" width="205" height="52" rx="8" fill="#f8fafc" stroke="#d9e1ed" />
    <rect x="63" y="671" width="123" height="8" rx="4" fill="#dbe7f6" />
    <rect x="63" y="688" width="163" height="6" rx="3" fill="#e6edf6" />
  </g>
  <text x="35" y="754" class="detail">Drawer closed · 60 px topbar</text>

  <rect x="331" y="535" width="238" height="196" rx="13" fill="#ffffff" filter="url(#shadow)" />
  <g clip-path="url(#mobile-right-clip)">
    <rect x="331" y="535" width="238" height="43" fill="#ffffff" />
    <path d="M331 578h238" class="line" />
    <path d="M348 549h16m-16 6h16m-16 6h16" stroke="#155dfb" stroke-width="2" stroke-linecap="round" />
    <circle cx="387" cy="556" r="10" fill="#155dfb" />
    <rect x="331" y="578" width="238" height="153" fill="#1e293b" fill-opacity="0.38" />
    <rect x="331" y="535" width="174" height="196" fill="#eff5ff" />
    <circle cx="355" cy="558" r="10" fill="#155dfb" />
    <text x="375" y="563" class="label">Your brand</text>
    <text x="347" y="601" class="small">PRIMARY NAVIGATION</text>
    <rect x="343" y="611" width="149" height="29" rx="6" fill="#d9e8ff" />
    <text x="358" y="630" class="blue" font-size="12" font-weight="700">Overview</text>
    <text x="358" y="661" class="detail">Projects</text>
    <text x="358" y="691" class="detail">Settings</text>
  </g>
  <text x="331" y="754" class="detail">Drawer open · backdrop + focus</text>

  <rect x="608" y="548" width="258" height="159" rx="12" fill="#ffffff" stroke="#c8d8ee" />
  <text x="627" y="577" class="blue" font-size="14" font-weight="700">What changes?</text>
  <text x="627" y="607" class="detail">The sidebar becomes a drawer.</text>
  <text x="627" y="635" class="detail">The topbar becomes compact.</text>
  <text x="627" y="663" class="detail">The routed page keeps its place.</text>
  <text x="627" y="690" class="small">AppLayout handles the transition.</text>
</svg>
